[package]
name = "latch-retry"
version = "0.1.1"
edition = "2021"
description = "Retry, fallback and circuit-breaker policy primitives for Latch"
license = "Apache-2.0"
repository = "https://github.com/EeroEternal/latch"
homepage = "https://github.com/EeroEternal/latch"

[dependencies]
latch-core = { version = "0.2.0", path = "../latch-core" }
fastrand = "2"
tokio = { version = "1", features = ["time"], optional = true }

[features]
default = []
tokio = ["dep:tokio"]

[package]
name = "latchd"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", features = ["json"] }
dashmap = "5.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
latch-core = { path = "crates/latch-core" }
latch-compress = { path = "crates/latch-compress" }
latch-cache = { path = "crates/latch-cache" }
latch-router = { path = "crates/latch-router" }
latch-retry = { path = "crates/latch-retry" }
latch-detect = { path = "crates/latch-detect" }
latch-meter = { path = "crates/latch-meter" }
